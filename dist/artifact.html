      e: "CompTIA retient **risky** (risqué en connaissance de cause), **unexpected** (inattendu au regard du rôle) et **unintentional** (involontaire, par méconnaissance). Chacun appelle une réponse différente.", obj: "5.6" },
    { q: "Pourquoi une formation de sensibilisation annuelle unique est-elle insuffisante ?", o: ["Parce qu'elle coûte trop cher", "Parce que les menaces évoluent et que la vigilance décroît avec le temps", "Parce que la loi l'interdit", "Parce qu'elle est trop longue"], c: 1,
      e: "Les **menaces évoluent en permanence** et la **vigilance s'érode naturellement**. Une sensibilisation efficace est **récurrente et variée** : rappels courts, campagnes simulées, communications régulières.", obj: "5.6" },
    { q: "Qu'est-ce que l'OPSEC appliqué au comportement des employés ?", o: ["Le chiffrement des postes de travail", "Ne pas divulguer d'informations exploitables : réseaux sociaux, badges visibles, conversations en public", "La sauvegarde quotidienne des données", "L'installation d'un antivirus"], c: 1,
      e: "L'**OPSEC (Operational Security)** consiste à **ne pas divulguer d'informations exploitables** par un attaquant : publications sur les réseaux sociaux, badge visible hors du site, conversations professionnelles dans les transports.", obj: "5.6" },
    { q: "Pourquoi le télétravail élargit-il la surface d'attaque de l'entreprise ?", o: ["Parce que les employés travaillent moins", "Réseau domestique non maîtrisé, Wi-Fi publics, shoulder surfing et équipements partagés", "Parce que le VPN est vulnérable par nature", "Parce que les logs ne fonctionnent plus"], c: 1,

  App.riskProblem = function () {
    var assets = [
      { n: 'un serveur de base de données', v: [40000, 250000] },
      { n: 'une flotte de portables', v: [30000, 180000] },
      { n: 'un automate industriel', v: [60000, 400000] },
      { n: 'une baie de stockage', v: [80000, 500000] },
      { n: "un système de caisse d'un magasin", v: [20000, 120000] }
    ];
    var events = [
      { n: 'un incendie', ef: [0.3, 0.9], years: [8, 25] },
      { n: 'un dégât des eaux', ef: [0.2, 0.6], years: [5, 20] },
      { n: 'un vol de matériel', ef: [0.1, 0.4], years: [2, 10] },
      { n: 'une panne électrique majeure', ef: [0.15, 0.5], years: [3, 12] },
      { n: 'une attaque par ransomware', ef: [0.25, 0.8], years: [1, 6] }
    ];
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function rnd(min, max, step) { step = step || 1; return Math.round((min + Math.random() * (max - min)) / step) * step; }

    var a = pick(assets), e = pick(events);
    var av = rnd(a.v[0], a.v[1], 5000);
    var ef = rnd(e.ef[0] * 100, e.ef[1] * 100, 5) / 100;
    var years = rnd(e.years[0], e.years[1], 1);
    var aro = 1 / years;
    var sle = av * ef;
    var ale = sle * aro;

    return {
      text: "La valeur de " + a.n + " est estimée à **" + av.toLocaleString('fr-FR') + " €**. " +
            "En cas " + (e.n.indexOf('une') === 0 ? "d'" + e.n.slice(4) : "de " + e.n.slice(3)) +
            ", on estime que **" + Math.round(ef * 100) + " %** de sa valeur serait perdue. " +
            "Ce type d'événement survient statistiquement **une fois tous les " + years + " ans**.",
      av: av, ef: ef, years: years, aro: aro, sle: sle, ale: ale,
      questions: [
        { label: 'SLE (Single Loss Expectancy) en €', answer: sle, hint: 'SLE = AV × EF' },
        { label: 'ARO (Annualized Rate of Occurrence)', answer: aro, hint: 'ARO = 1 / nombre d\'années', decimals: 4 },
        { label: 'ALE (Annualized Loss Expectancy) en €', answer: ale, hint: 'ALE = SLE × ARO' }
      ]
    };
  };

(function (App) {
  'use strict';

  var U = App.util = {};

  /** Échappement HTML — toute donnée injectée dans le DOM passe par ici. */
  U.esc = function (s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  U.rich = function (s) {
    return U.esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  /** Mélange Fisher-Yates sur une copie. */
  U.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  U.sample = function (arr, n) { return U.shuffle(arr).slice(0, Math.max(0, n)); };
  U.clamp = function (v, min, max) { return Math.min(max, Math.max(min, v)); };
  U.pct = function (a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; };

  /** Clé de jour local au format YYYY-MM-DD (pas UTC : le streak suit l'utilisateur). */
  U.dayKey = function (d) {
    var x = d ? new Date(d) : new Date();
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  };

  U.daysBetween = function (aKey, bKey) {
    var a = new Date(aKey + 'T00:00:00'), b = new Date(bKey + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  };

  U.mmss = function (sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  };

  U.plural = function (n, one, many) { return n + ' ' + (n > 1 ? (many || one + 's') : one); };

  /** Normalisation pour comparaison de saisie libre : minuscules, sans accents ni ponctuation. */
  U.norm = function (s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();

  U.el = function (tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    }
    if (children) [].concat(children).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  };

  /** Identifiant stable et déterministe (sert de clé SRS pour une carte / question). */
  U.hash = function (str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;

/* ============================================================================

(function (App) {

    } catch (e) {
      return null;
    }

    if (memoryFallback) { memoryFallback = obj; return; }

      memoryFallback = obj;
      if (!writeRaw._warned) {
        writeRaw._warned = true;

      srs: {},

      quiz: {},

      sections: {},

/* ============================================================================
   SRS — répétition espacée (variante simplifiée de SM-2)
   Note de rappel : 0 = oublié, 1 = difficile, 2 = correct, 3 = facile.
   ========================================================================== */
(function (App) {
  'use strict';

  var U = App.util;
  var R = App.srs = {};

  R.cardId = function (sectionId, index) { return 's' + sectionId + 'c' + index; };

  /** Copie défensive : l'appelant ne peut pas muter l'état stocké par inadvertance. */
  function entry(id) {
    var e = App.store.data.srs[id];
    if (!e) return { ease: 2.5, interval: 0, due: U.dayKey(), reps: 0, lapses: 0, last: null };
    return { ease: e.ease, interval: e.interval, due: e.due, reps: e.reps, lapses: e.lapses, last: e.last };
  }
  R.entry = entry;

  /** Une carte est due si elle n'a jamais été vue ou si sa date d'échéance est atteinte. */
  R.isDue = function (id) {
    var e = App.store.data.srs[id];
    if (!e) return true;
    return U.daysBetween(e.due, U.dayKey()) >= 0;
  };

  R.isNew = function (id) { return !App.store.data.srs[id]; };

  /** Applique une note et calcule la prochaine échéance. */
  R.grade = function (id, q) {
    var e = entry(id);
    q = U.clamp(q, 0, 3);

    if (q === 0) {
      // Oubli : on repart du début et on pénalise la facilité.
      e.lapses++;
      e.reps = 0;
      e.interval = 0;          // à revoir dans la même session
      e.ease = Math.max(1.3, e.ease - 0.25);
    } else {
      e.reps++;
      if (e.reps === 1)      e.interval = (q === 1) ? 1 : (q === 2 ? 2 : 4);
      else if (e.reps === 2) e.interval = (q === 1) ? 3 : (q === 2 ? 6 : 10);
      else                   e.interval = Math.round(e.interval * e.ease * (q === 1 ? 0.6 : (q === 3 ? 1.3 : 1)));

      // Ajustement de la facilité selon la qualité du rappel.
      var delta = (q === 1) ? -0.15 : (q === 3 ? 0.10 : 0);
      e.ease = U.clamp(e.ease + delta, 1.3, 2.8);
      e.interval = U.clamp(e.interval, 1, 365);
    }

    var d = new Date();
    d.setDate(d.getDate() + e.interval);
    e.due = U.dayKey(d);
    e.last = U.dayKey();

    App.store.data.srs[id] = e;
    App.store.data.totals.cards++;
    App.store.touch('cards', 1);
    return e;
  };

  /** Toutes les cartes dues, tous chapitres confondus (ou une section donnée). */
  R.dueCards = function (sectionId) {
    var out = [];
    var sections = sectionId ? [sectionId] : Object.keys(App.FLASHCARDS || {});
    sections.forEach(function (sid) {
      var list = (App.FLASHCARDS || {})[sid] || [];
      list.forEach(function (card, i) {
        var id = R.cardId(sid, i);
        if (R.isDue(id)) out.push({ id: id, card: card, section: Number(sid), index: i });
      });
    });
    return out;
  };

  R.dueCount = function () { return R.dueCards().length; };

  /** Répartition des cartes par état de maîtrise, pour les statistiques. */
  R.breakdown = function () {
    var b = { fresh: 0, learning: 0, young: 0, mature: 0, total: 0 };
    Object.keys(App.FLASHCARDS || {}).forEach(function (sid) {
      ((App.FLASHCARDS || {})[sid] || []).forEach(function (c, i) {
        var e = App.store.data.srs[R.cardId(sid, i)];
        b.total++;
        if (!e || e.reps === 0) b.fresh++;
        else if (e.interval < 4) b.learning++;
        else if (e.interval < 21) b.young++;
        else b.mature++;

    });

  };

/* ============================================================================
   VUE — Flashcards avec répétition espacée
   mode : 'all' (toutes), 'due' (révision du jour), ou un id de section
   ========================================================================== */
(function (App) {
  'use strict';

  var U = App.util;
  App.views = App.views || {};

  App.views.flashcards = function (mode) {
    var deck = buildDeck(mode);
    var title, lead;

    if (mode === 'due') {
      title = 'Révision du jour';
      lead = "Les cartes dont l'échéance est atteinte, toutes sections confondues. Notez-vous honnêtement : l'algorithme ajuste les prochaines échéances.";
    } else if (mode === 'all') {
      title = 'Toutes les flashcards';
      lead = "L'intégralité des cartes du programme, mélangées. Idéal pour un balayage large.";
    } else {
      var sec = App.SECTION_BY_ID[Number(mode)];
      if (!sec) return notFound();
      title = 'Flashcards — ' + sec.title;
      lead = 'Section ' + sec.id + ' · ' + deck.length + ' cartes.';
    }

    if (!deck.length) {
      return App.ui.pagehead({ eyebrow: 'Flashcards', title: title }) +
        App.ui.empty('✅', 'Rien à réviser pour le moment',
          mode === 'due' ? "Toutes vos cartes sont à jour. Revenez demain ou parcourez une section." : "Aucune carte disponible ici.") +
        '<div style="text-align:center"><a class="btn btn--soft" href="#/">Retour au tableau de bord</a></div>';
    }

    deck = U.shuffle(deck);

    var wrap = U.el('div');
    var i = 0, flipped = false;
    var session = { seen: 0, again: 0, good: 0 };

    wrap.innerHTML =
      App.ui.pagehead({ eyebrow: 'Flashcards', title: title, lead: lead }) +
      '<div class="qhead">' +
        '<div class="qprog">' + App.ui.bar(0) + '</div>' +
        '<div class="qcount" id="fcCount"></div>' +
      '</div>' +
      '<div class="fcstage"><div class="fc" id="fc">' +
        '<div class="fc__face fc__face--front">' +
          '<div class="fc__tag" id="fcTagF"></div>' +
          '<div class="fc__q" id="fcQ"></div>' +
          '<div class="fc__hint">Cliquez ou appuyez sur <span class="kbd">Espace</span> pour retourner</div>' +
        '</div>' +
        '<div class="fc__face fc__face--back">' +
          '<div class="fc__tag" id="fcTagB"></div>' +
          '<div class="fc__a" id="fcA"></div>' +
        '</div>' +
      '</div></div>' +
      '<div id="fcActions"></div>';

    var fc = wrap.querySelector('#fc');
    var actions = wrap.querySelector('#fcActions');
    var bar = wrap.querySelector('.bar > i');

    function paint() {
      var item = deck[i];
      var sec = App.SECTION_BY_ID[item.section];
      var tag = 'Section ' + item.section + ' · ' + (sec ? sec.title : '');
      var e = App.store.data.srs[item.id];
      var state = !e || e.reps === 0 ? 'Nouvelle' : (e.interval < 4 ? 'En cours' : (e.interval < 21 ? 'Consolidée' : 'Acquise'));

      wrap.querySelector('#fcTagF').textContent = tag;
      wrap.querySelector('#fcTagB').textContent = state + (e && e.reps ? ' · vue ' + e.reps + '×' : '');
      wrap.querySelector('#fcQ').innerHTML = U.rich(item.card.q);
      wrap.querySelector('#fcA').innerHTML = U.rich(item.card.a);
      wrap.querySelector('#fcCount').textContent = (i + 1) + ' / ' + deck.length;
      bar.style.width = U.pct(i, deck.length) + '%';

      flipped = false;
      fc.classList.remove('is-flipped');
      renderActions();
    }

    function renderActions() {
      if (!flipped) {
        actions.innerHTML = '<button class="btn btn--soft btn--block btn--lg" id="showBtn">Afficher la réponse</button>';
        actions.querySelector('#showBtn').onclick = flip;
      } else {
        actions.innerHTML = '<div class="fcgrade">' +
          '<button class="g0" data-g="0">Oublié<small>revoir maintenant</small></button>' +
          '<button class="g1" data-g="1">Difficile<small>bientôt</small></button>' +
          '<button class="g2" data-g="2">Correct<small>plus tard</small></button>' +
          '<button class="g3" data-g="3">Facile<small>beaucoup plus tard</small></button>' +
        '</div>';
        U.qsa('[data-g]', actions).forEach(function (b) {
          b.onclick = function () { grade(Number(b.getAttribute('data-g'))); };
        });
      }
    }

    function flip() {
      flipped = true;
      fc.classList.add('is-flipped');
      renderActions();
    }

    function grade(q) {
      var item = deck[i];
      App.srs.grade(item.id, q);
      App.store.save();
      session.seen++;
      if (q === 0) { session.again++; deck.push(item); } else { session.good++; }

      i++;
      if (i >= deck.length) return finish();
      paint();
    }

    function finish() {
      bar.style.width = '100%';
      var pct = session.seen ? U.pct(session.good, session.seen) : 0;
      wrap.querySelector('.fcstage').innerHTML =
        '<div class="card card--pad-lg" style="text-align:center">' +
          '<div style="font-size:44px;margin-bottom:12px">' + (pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪') + '</div>' +
          '<h2 class="h2" style="margin-bottom:8px">Session terminée</h2>' +
          '<p class="lead" style="margin:0 auto 20px">' +
            U.plural(session.seen, 'carte') + ' révisée' + (session.seen > 1 ? 's' : '') + ' · ' +
            session.good + ' réussie' + (session.good > 1 ? 's' : '') + ' · ' +
            session.again + ' à revoir' + '</p>' +
          '<div style="display:flex;justify-content:center;margin-bottom:22px">' + App.ui.ring(pct, 'réussite', 116) + '</div>' +
          '<div class="btnrow" style="justify-content:center">' +
            '<a class="btn btn--soft" href="#/">Tableau de bord</a>' +
            '<button class="btn btn--primary" id="againBtn">Refaire une session</button>' +
          '</div>' +
        '</div>';
      wrap.querySelector('#fcCount').textContent = 'Terminé';
      actions.innerHTML = '';
      wrap.querySelector('#againBtn').onclick = function () {
        var v = document.getElementById('view');
        v.innerHTML = '';
        v.appendChild(App.views.flashcards(mode));
      };
      App.refreshChrome();
    }

    fc.addEventListener('click', function () { if (!flipped) flip(); });

    function onKey(e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        if (!flipped) flip();
      } else if (flipped && e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        grade(Number(e.key) - 1);
      }
    }
    document.addEventListener('keydown', onKey);
    App.onLeave(function () { document.removeEventListener('keydown', onKey); });

    paint();
    return wrap;
  };

  /* --------------------------- Construction du paquet --------------------------- */
  function buildDeck(mode) {
    var out = [];
    if (mode === 'due') return App.srs.dueCards();

    var sections = (mode === 'all')
      ? Object.keys(App.FLASHCARDS)
      : [String(Number(mode))];

    sections.forEach(function (sid) {
      (App.FLASHCARDS[sid] || []).forEach(function (card, idx) {
        out.push({ id: App.srs.cardId(sid, idx), card: card, section: Number(sid), index: idx });
      });
    });
    return out;
  }

  function notFound() {
    return App.ui.empty('🧭', 'Section introuvable', "Ce paquet de cartes n'existe pas.") +
      '<div style="text-align:center"><a class="btn btn--soft" href="#/parcours">Voir le parcours</a></div>';
  }

})(window.App = window.App || {});

  /* ---------------------------------------------------------------------- */
  /*  3. MISE EN ORDRE — glisser-déposer + boutons monter/descendre          */
  /* ---------------------------------------------------------------------- */
  function buildOrder(host, d, done) {

    var current = U.shuffle(correct);

    var guard = 0;

      U.qsa('.oitem', listEl).forEach(function (row, idx) {

      var taken = {};

      var rest = U.shuffle(all.filter(function (x) { return !taken[x.id]; }));

  App.views.ports = function () {

  /* ----------------------- Entraînement aux ports ----------------------- */
  function portTrainer() {
    var items = U.sample(App.PORTS, Math.min(20, App.PORTS.length));
    var i = 0, correct = 0, answered = false;
    var wrap = U.el('div');

    wrap.innerHTML =
      App.ui.pagehead({ eyebrow: 'Entraînement', title: 'Quel port pour ce service ?', lead: 'Associez chaque service à son port standard.' }) +
      '<div class="qhead"><div class="qprog">' + App.ui.bar(0) + '</div><div class="qcount" id="pCount"></div></div>' +
      '<div id="ptHost"></div>';

    var host = wrap.querySelector('#ptHost');
    var bar = wrap.querySelector('.bar > i');

    function paint() {
      answered = false;
      var p = items[i];
      var others = U.sample(App.PORTS.filter(function (x) { return x.port !== p.port; }), 3);
      var opts = U.shuffle(others.map(function (x) { return { text: x.port, ok: false }; })
        .concat([{ text: p.port, ok: true }]));

      wrap.querySelector('#pCount').textContent = (i + 1) + ' / ' + items.length;
      bar.style.width = U.pct(i, items.length) + '%';

      host.innerHTML = '<div class="qcard">' +
        '<div style="text-align:center;margin-bottom:22px">' +
          '<div style="font-size:clamp(24px,5vw,36px);font-weight:800;letter-spacing:-.02em">' + U.esc(p.name) + '</div>' +
          '<div class="muted" style="margin-top:6px">' + U.esc(p.proto) + '</div>' +
        '</div>' +
        '<div class="qopts">' + opts.map(function (o, idx) {
          return '<button class="qopt" data-ok="' + (o.ok ? '1' : '0') + '" style="justify-content:center">' +
            '<span class="qopt__k">' + 'ABCD'[idx] + '</span>' +
            '<span class="mono" style="font-size:17px;font-weight:700">' + U.esc(o.text) + '</span></button>';
        }).join('') + '</div><div id="ptFeed"></div></div>';

      U.qsa('.qopt', host).forEach(function (b) {
        b.onclick = function () {
          if (answered) return;
          answered = true;
          var ok = b.getAttribute('data-ok') === '1';
          if (ok) correct++;
          U.qsa('.qopt', host).forEach(function (x) {
            x.disabled = true;
            if (x.getAttribute('data-ok') === '1') x.classList.add('is-correct');
            else if (x === b) x.classList.add('is-wrong');
          });
          wrap.querySelector('#ptFeed').innerHTML =
            '<div class="qfeed ' + (ok ? 'qfeed--ok' : 'qfeed--err') + '">' +
              '<div class="qfeed__t">' + (ok ? '✓ Correct' : '✕ Incorrect') + '</div>' +
              '<div class="qfeed__b"><strong>' + U.esc(p.name) + ' → port ' + U.esc(p.port) + ' (' + U.esc(p.proto) + ')</strong><br>' +
              U.esc(p.desc) + (p.alt ? '<br><span style="color:var(--accent)">Alternative sécurisée : ' + U.esc(p.alt) + '</span>' : '') +
              '</div></div>' +
            '<div class="btnrow" style="margin-top:16px;justify-content:flex-end">' +
              '<button class="btn btn--primary" id="nextBtn">' + (i + 1 >= items.length ? 'Voir le résultat' : 'Suivant →') + '</button></div>';
          var nb = wrap.querySelector('#nextBtn');
          nb.focus();
          nb.onclick = function () { i++; if (i >= items.length) return finish(); paint(); };
        };
      });
    }

    function finish() {
      bar.style.width = '100%';
      wrap.querySelector('#pCount').textContent = 'Terminé';
      var pct = U.pct(correct, items.length);
      host.innerHTML = '<div class="card card--pad-lg" style="text-align:center">' +
        '<div style="font-size:44px;margin-bottom:10px">' + (pct >= 80 ? '🎉' : '💪') + '</div>' +
        '<h2 class="h2" style="margin-bottom:8px">Série terminée</h2>' +
        '<p class="lead" style="margin:0 auto 20px">' + correct + ' bonnes réponses sur ' + items.length + '</p>' +
        '<div style="display:flex;justify-content:center;margin-bottom:22px">' + App.ui.ring(pct, 'réussite', 120) + '</div>' +
        '<div class="btnrow" style="justify-content:center">' +
          '<a class="btn btn--soft" href="#/ports">Retour au tableau</a>' +
          '<button class="btn btn--primary" id="againBtn">Nouvelle série</button></div></div>';
      wrap.querySelector('#againBtn').onclick = function () {
        var v = document.getElementById('view');
        v.innerHTML = '';
        v.appendChild(portTrainer());
      };
    }

    function onKey(e) {
      if (e.key >= '1' && e.key <= '4') {
        var btns = U.qsa('.qopt', host);
        if (btns[Number(e.key) - 1]) { e.preventDefault(); btns[Number(e.key) - 1].click(); }
      } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
        var nb = wrap.querySelector('#nextBtn');
        if (nb) { e.preventDefault(); nb.click(); }
      }
    }
    document.addEventListener('keydown', onKey);
    App.onLeave(function () { document.removeEventListener('keydown', onKey); });

    paint();
    return wrap;
  }

  App.views.formulas = function () {
    var wrap = U.el('div');

    wrap.innerHTML =
      App.ui.pagehead({
        eyebrow: 'Entraînement au calcul',
        title: 'Formules de risque',
        lead: "Les calculs SLE / ARO / ALE tombent presque à chaque examen. Cet exercice génère un énoncé différent à chaque tirage : entraînez-vous jusqu'à ce que ce soit automatique."
      }) +
      '<div class="card" style="margin-bottom:20px">' +
        '<div class="h3" style="margin-bottom:12px">Les formules à connaître par cœur</div>' +
        '<div class="grid grid--3">' +
          formulaCard('SLE', 'AV × EF', 'Single Loss Expectancy : la perte pour UN seul incident. AV = valeur de l\'actif, EF = pourcentage détruit.') +
          formulaCard('ARO', '1 / nb d\'années', 'Annualized Rate of Occurrence : combien de fois par an l\'événement survient.') +
          formulaCard('ALE', 'SLE × ARO', 'Annualized Loss Expectancy : la perte attendue par an. C\'est elle qui justifie un budget.') +
        '</div>' +
        '<div class="callout callout--tip" style="margin-top:16px">' +
          '<strong>Règle de décision :</strong> une contre-mesure est rentable si son <strong>coût annuel est inférieur à la réduction d\'ALE</strong> qu\'elle procure. ' +
          'Si elle coûte plus cher que la perte annuelle attendue, on ne l\'achète pas.' +
        '</div>' +
      '</div>' +
      '<div id="fHost"></div>';

    var host = wrap.querySelector('#fHost');

    function newProblem() {
      var p = App.riskProblem();
      var done = false;

      host.innerHTML = '<div class="drill">' +
        '<div class="drill__t">Énoncé</div>' +
        '<p class="lead" style="margin-bottom:20px">' + U.rich(p.text) + '</p>' +
        '<div class="grid grid--3" style="gap:14px">' +
          p.questions.map(function (q, idx) {
            return '<div>' +
              '<label style="display:block;font-size:13px;font-weight:650;margin-bottom:6px">' + U.esc(q.label) + '</label>' +
              '<input type="text" inputmode="decimal" class="fillgap" data-q="' + idx + '" ' +
                'style="width:100%;min-width:0;text-align:left;padding:11px 13px" placeholder="' + U.esc(q.hint) + '">' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="btnrow" style="margin-top:18px">' +
          '<button class="btn btn--primary" id="checkBtn">Vérifier</button>' +
          '<button class="btn btn--soft" id="newBtn">Nouvel énoncé</button>' +
        '</div>' +
        '<div id="fFeed" style="margin-top:16px"></div>' +
      '</div>';

      var inputs = U.qsa('[data-q]', host);
      inputs.forEach(function (inp) {
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); host.querySelector('#checkBtn').click(); }
        });
      });

      host.querySelector('#newBtn').onclick = newProblem;

      host.querySelector('#checkBtn').onclick = function () {
        if (done) return;
        done = true;
        var right = 0;

        inputs.forEach(function (inp, idx) {
          var q = p.questions[idx];
          // Tolérance : on accepte les espaces, virgules décimales et le symbole €
          var raw = inp.value.replace(/[€\s ]/g, '').replace(',', '.');
          var val = parseFloat(raw);
          var expected = q.answer;
          // Marge de 1 % pour absorber les arrondis de l'utilisateur
          var ok = !isNaN(val) && Math.abs(val - expected) <= Math.max(Math.abs(expected) * 0.01, 0.0005);
          inp.classList.add(ok ? 'is-ok' : 'is-ko');
          inp.disabled = true;
          if (ok) right++;
        });

        host.querySelector('#checkBtn').disabled = true;

        var fmt = function (n) { return n.toLocaleString('fr-FR', { maximumFractionDigits: 2 }); };
        host.querySelector('#fFeed').innerHTML =
          '<div class="qfeed ' + (right === 3 ? 'qfeed--ok' : 'qfeed--err') + '">' +
            '<div class="qfeed__t">' + (right === 3 ? '✓ Les trois calculs sont exacts' : right + ' / 3 correct' + (right > 1 ? 's' : '')) + '</div>' +
            '<div class="qfeed__b">' +
              '<strong>SLE</strong> = AV × EF = ' + fmt(p.av) + ' × ' + p.ef + ' = <strong>' + fmt(p.sle) + ' €</strong><br>' +
              '<strong>ARO</strong> = 1 / ' + p.years + ' = <strong>' + p.aro.toFixed(4) + '</strong><br>' +
              '<strong>ALE</strong> = SLE × ARO = ' + fmt(p.sle) + ' × ' + p.aro.toFixed(4) + ' = <strong>' + fmt(p.ale) + ' €/an</strong><br><br>' +
              '<span class="muted">Une contre-mesure coûtant moins de ' + fmt(p.ale) + ' € par an serait économiquement justifiée.</span>' +
            '</div>' +
          '</div>';
      };
    }

    newProblem();
    return wrap;
  };

  function formulaCard(name, formula, desc) {
    return '<div style="padding:16px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border)">' +
      '<div class="mono" style="font-size:19px;font-weight:800;color:var(--accent);margin-bottom:4px">' + U.esc(name) + '</div>' +

      '<p class="muted" style="line-height:1.55">' + U.esc(desc) + '</p></div>';

        feed.innerHTML = '<div class="callout callout--warn">Le téléchargement automatique a été bloqué. ' +
          'Copiez le contenu ci-dessous et collez-le dans un fichier <span class="mono">.json</span> :</div>' +
          '<textarea readonly style="width:100%;height:170px;margin-top:10px;padding:12px;border-radius:11px;' +
          'background:var(--surface-2);border:1px solid var(--border);font-family:var(--mono);font-size:12px">' +
          U.esc(S.export()) + '</textarea>';
      }
    };

    var fileInput = wrap.querySelector('#fileInput');
    wrap.querySelector('#importBtn').onclick = function () { fileInput.click(); };

    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          S.import(String(reader.result));
          App.ui.toast('Progression importée', 'ok');
          App.refreshChrome();
          var v = document.getElementById('view');
          v.innerHTML = '';
          v.appendChild(App.views.stats());
        } catch (err) {
          feed.innerHTML = '<div class="callout callout--warn">Fichier invalide : ' + U.esc(err.message) + '</div>';
        }
      };
      reader.onerror = function () {
        feed.innerHTML = '<div class="callout callout--warn">Impossible de lire ce fichier.</div>';
      };
      reader.readAsText(f);
      fileInput.value = '';
    });

    wrap.querySelector('#resetBtn').onclick = function () {
      App.ui.confirm(
        'Toute votre progression sera définitivement effacée : flashcards, quiz, exercices et examens. Cette action est irréversible.',
        function () {
          S.reset();
          App.ui.toast('Progression réinitialisée', 'ok');
          App.refreshChrome();
          location.hash = '#/';
        });
    };

    return wrap;
  };

  /* ------------------------------ Fragments ------------------------------ */
  function stat(k, v, s) {
    return '<div class="stat"><div class="stat__k">' + U.esc(k) + '</div>' +
      '<div class="stat__v">' + U.esc(String(v)) + '</div>' +
      (s ? '<div class="stat__s">' + U.esc(s) + '</div>' : '') + '</div>';
  }

  function srsBox(label, n, total, color, sub) {
    return '<div style="text-align:center;padding:13px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)">' +
      '<div style="font-size:23px;font-weight:800;color:' + color + '">' + n + '</div>' +
      '<div style="font-size:12px;font-weight:650;margin-top:2px">' + U.esc(label) + '</div>' +
      '<div class="muted" style="font-size:11px;margin-top:2px">' + U.esc(sub) + '</div></div>';
  }

  function seg(n, total, color) {
    if (!total || !n) return '';
    return '<div style="width:' + (n / total * 100) + '%;background:' + color + '"></div>';
  }

  /** Histogramme d'activité sur 30 jours, en SVG inline (aucune dépendance). */
  function activityChart(S) {
    var days = [];
    var max = 1;
    for (var k = 29; k >= 0; k--) {
      var d = new Date();
      d.setDate(d.getDate() - k);
      var key = U.dayKey(d);
      var a = S.data.activity[key] || { cards: 0, questions: 0, drills: 0 };
      var total = a.cards + a.questions + a.drills;
      if (total > max) max = total;
      days.push({ key: key, total: total, a: a });
    }

    var active = days.filter(function (d) { return d.total > 0; }).length;
    var sum = days.reduce(function (acc, d) { return acc + d.total; }, 0);

    var W = 100, H = 34, gap = 0.7;
    var bw = (W - gap * (days.length - 1)) / days.length;

    var bars = days.map(function (d, i) {
      var h = d.total > 0 ? Math.max(1.6, (d.total / max) * H) : 0.8;
      var x = i * (bw + gap);
      var y = H - h;
      var fill = d.total > 0 ? 'var(--accent)' : 'var(--surface-3)';
      return '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + h.toFixed(2) + '" ' +
        'rx="0.5" fill="' + fill + '"><title>' + U.esc(U.humanDate(d.key)) + ' : ' + d.total + ' actions</title></rect>';
    }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:120px;display:block" role="img" ' +
      'aria-label="Activité des 30 derniers jours">' + bars + '</svg>' +
      '<div style="display:flex;justify-content:space-between;margin-top:9px" class="muted">' +
        '<span>' + U.humanDate(days[0].key) + '</span>' +
        '<span>' + active + ' jours actifs · ' + sum + ' actions au total</span>' +
        '<span>Aujourd\'hui</span>' +
      '</div>';
  }

  /** Courbe d'évolution des scores d'examens, en SVG inline. */
  function examChart(exams) {
    var list = exams.slice(0, 15).reverse();
    if (list.length < 2) {
      return '<p class="muted" style="text-align:center;padding:18px 0">' +
        'Passez au moins deux examens blancs pour visualiser votre progression.</p>';
    }

    var W = 100, H = 40;
    var min = 100, max = 900;
    var pts = list.map(function (e, i) {
      var x = (i / (list.length - 1)) * W;
      var y = H - ((e.score - min) / (max - min)) * H;
      return { x: x, y: y, e: e };
    });

    var line = pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p.x.toFixed(2) + ' ' + p.y.toFixed(2); }).join(' ');
    var passY = H - ((750 - min) / (max - min)) * H;

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:150px;display:block" role="img" ' +
      'aria-label="Évolution des scores d\'examen">' +
      '<line x1="0" y1="' + passY.toFixed(2) + '" x2="' + W + '" y2="' + passY.toFixed(2) + '" ' +
        'stroke="var(--green)" stroke-width="0.3" stroke-dasharray="1.5 1"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>' +
      pts.map(function (p) {
        return '<circle cx="' + p.x.toFixed(2) + '" cy="' + p.y.toFixed(2) + '" r="0.9" ' +
          'fill="' + (p.e.score >= 750 ? 'var(--green)' : 'var(--red)') + '">' +
          '<title>' + new Date(p.e.date).toLocaleDateString('fr-FR') + ' : ' + p.e.score + '/900</title></circle>';
      }).join('') +
      '</svg>' +
      '<div style="display:flex;justify-content:space-between;margin-top:9px" class="muted">' +
        '<span>Plus ancien</span>' +
        '<span><span style="color:var(--green)">— — —</span> seuil de réussite : 750</span>' +
        '<span>Plus récent</span>' +
      '</div>';
  }

})(window.App = window.App || {});

/* ===== assets/js/app.js ===== */
/* ============================================================================
   APP — routeur, navigation, recherche globale, raccourcis clavier
   ========================================================================== */
(function (App) {
  'use strict';

  var U = App.util;
  var viewEl, mainEl;

  /* ============================== Routes ============================== */
  var routes = [
    { re: /^\/$/,                 view: function () { return App.views.dashboard(); } },
    { re: /^\/parcours$/,         view: function () { return App.views.roadmap(); } },
    { re: /^\/section\/(\d+)$/,   view: function (m) { return App.views.section(+m[1]); } },
    { re: /^\/flash\/(all|\d+)$/, view: function (m) { return App.views.flashcards(m[1]); } },
    { re: /^\/revision$/,         view: function () { return App.views.flashcards('due'); } },
    { re: /^\/quiz\/(all|weak|\d+)$/, view: function (m) { return App.views.quiz(m[1]); } },
    { re: /^\/drills\/(all|\d+)$/,view: function (m) { return App.views.drills(m[1]); } },
    { re: /^\/exam$/,             view: function () { return App.views.exam(); } },
    { re: /^\/labs$/,             view: function () { return App.views.labs(); } },
    { re: /^\/labs\/([\w-]+)$/,   view: function (m) { return App.views.lab(m[1]); } },
    { re: /^\/acronymes$/,        view: function () { return App.views.acronyms(); } },
    { re: /^\/ports$/,            view: function () { return App.views.ports(); } },
    { re: /^\/formules$/,         view: function () { return App.views.formulas(); } },
    { re: /^\/objectifs$/,        view: function () { return App.views.objectives(); } },
    { re: /^\/stats$/,            view: function () { return App.views.stats(); } }
  ];

  /** Nettoie proprement la vue précédente (timers, écouteurs globaux). */
  var cleanup = null;
  App.onLeave = function (fn) { cleanup = fn; };

  function currentPath() {
    var h = location.hash.replace(/^#/, '');
    return h || '/';
  }

  function render() {
    if (typeof cleanup === 'function') {
      try { cleanup(); } catch (e) { /* la vue précédente ne doit jamais bloquer la suivante */ }
      cleanup = null;
    }

    var path = currentPath();
    var matched = null, params = null;

    for (var i = 0; i < routes.length; i++) {
      var m = path.match(routes[i].re);
      if (m) { matched = routes[i]; params = m; break; }
    }

    viewEl.innerHTML = '';
    window.scrollTo(0, 0);

    if (!matched) {
      viewEl.innerHTML = App.ui.empty('🧭', 'Page introuvable',
        "Cette adresse n'existe pas.") +
        '<div style="text-align:center"><a class="btn btn--primary" href="#/">Retour au tableau de bord</a></div>';
      setActiveNav(path);
      return;
    }

    try {
      var out = matched.view(params);
      if (typeof out === 'string') viewEl.innerHTML = out;
      else if (out instanceof Node) viewEl.appendChild(out);
    } catch (err) {
      // Une vue qui plante ne doit jamais laisser un écran blanc.
      console.error('Erreur de rendu :', err);
      viewEl.innerHTML = App.ui.empty('⚠️', 'Une erreur est survenue',
        "Cette page n'a pas pu s'afficher. Le reste du site reste utilisable.") +
        '<div style="text-align:center"><a class="btn btn--soft" href="#/">Retour au tableau de bord</a></div>';
    }

    setActiveNav(path);
    refreshChrome();
  }

  /* ============================ Navigation ============================ */
  function setActiveNav(path) {
    U.qsa('.navlink').forEach(function (a) {
      var r = a.getAttribute('data-route');
      var on = (r === '/') ? (path === '/') : (path.indexOf(r) === 0);
      a.classList.toggle('is-active', on);
    });
    U.qsa('.navsec').forEach(function (a) {
      a.classList.toggle('is-active', a.getAttribute('href') === '#' + path);
    });
  }

  function buildSectionNav() {
    var host = document.getElementById('sectionNav');
    if (!host) return;
    host.innerHTML = App.SECTIONS.map(function (s) {
      var p = App.store.sectionProgress(s.id);
      return '<a class="navsec' + (p >= 80 ? ' is-done' : '') + '" href="#/section/' + s.id + '" title="' + U.esc(s.title) + '">' +
        '<span class="navsec__n">' + (p >= 80 ? '✓' : s.id) + '</span>' +
        '<span class="navsec__t">' + U.esc(s.title) + '</span></a>';
    }).join('');
  }

  /** Met à jour les éléments persistants (série, badge de révision, nav). */
  function refreshChrome() {
    var sv = document.getElementById('streakVal');
    if (sv) sv.textContent = App.store.streak();

    var due = App.srs.dueCount();
    var badge = document.getElementById('dueBadge');
    if (badge) {
      badge.textContent = due > 99 ? '99+' : due;
      badge.hidden = due === 0;
    }
    buildSectionNav();
    setActiveNav(currentPath());
  }
  App.refreshChrome = refreshChrome;

  /* ============================== Thème ============================== */
  function setupTheme() {
    var btn = document.getElementById('themeBtn');
    function paint() { btn.textContent = App.store.getTheme() === 'dark' ? '🌙' : '☀️'; }
    paint();
    btn.addEventListener('click', function () {
      App.store.setTheme(App.store.getTheme() === 'dark' ? 'light' : 'dark');
      paint();
    });
  }

  /* ============================ Menu mobile ============================ */
  function setupSidebar() {
    var burger = document.getElementById('burger');
    var sidebar = document.getElementById('sidebar');
    var scrim = document.getElementById('scrim');

    function open(v) {
      sidebar.classList.toggle('is-open', v);
      scrim.hidden = !v;
      burger.setAttribute('aria-expanded', v ? 'true' : 'false');
      document.body.style.overflow = v ? 'hidden' : '';
    }
    burger.addEventListener('click', function () { open(!sidebar.classList.contains('is-open')); });
    scrim.addEventListener('click', function () { open(false); });
    sidebar.addEventListener('click', function (e) {
      if (e.target.closest('a') && window.innerWidth <= 1000) open(false);
    });
    window.addEventListener('resize', function () {
      if (window.innerWidth > 1000) open(false);
    });
  }

  /* =========================== Recherche =========================== */
  var searchIndex = null;

  function buildIndex() {
    if (searchIndex) return searchIndex;
    var idx = [];

    App.SECTIONS.forEach(function (s) {
      idx.push({ t: 'Section ' + s.id + ' — ' + s.title, m: s.fr + ' · ' + App.getDomain(s.domain).fr, h: '#/section/' + s.id, k: (s.title + ' ' + s.fr + ' ' + s.summary + ' ' + s.lessons.join(' ')).toLowerCase() });
      (s.keypoints || []).forEach(function (kp) {
        idx.push({ t: kp.length > 90 ? kp.slice(0, 90) + '…' : kp, m: 'Point clé · Section ' + s.id, h: '#/section/' + s.id, k: kp.toLowerCase() });
      });
    });

    (App.ACRONYMS || []).forEach(function (a) {
      idx.push({ t: a.a + ' — ' + a.f, m: 'Acronyme' + (a.fr ? ' · ' + a.fr : ''), h: '#/acronymes', k: (a.a + ' ' + a.f + ' ' + (a.fr || '')).toLowerCase() });
    });

    (App.PORTS || []).forEach(function (p) {
      idx.push({ t: 'Port ' + p.port + ' — ' + p.name, m: p.proto + ' · ' + p.desc, h: '#/ports', k: (p.port + ' ' + p.name + ' ' + p.desc).toLowerCase() });
    });

    Object.keys(App.FLASHCARDS || {}).forEach(function (sid) {
      (App.FLASHCARDS[sid] || []).forEach(function (c) {
        idx.push({ t: c.q, m: 'Flashcard · Section ' + sid, h: '#/flash/' + sid, k: (c.q + ' ' + c.a).toLowerCase() });
      });
    });

    searchIndex = idx;
    return idx;
  }

  function setupSearch() {
    var modal = document.getElementById('searchModal');
    var input = document.getElementById('searchInput');
    var results = document.getElementById('searchResults');
    var cur = -1;

    function open() {
      modal.hidden = false;
      input.value = '';
      results.innerHTML = '<div class="muted" style="padding:16px;text-align:center">Tapez pour rechercher parmi les sections, points clés, flashcards, acronymes et ports.</div>';
      cur = -1;
      setTimeout(function () { input.focus(); }, 40);
    }
    function close() { modal.hidden = true; }
    App.openSearch = open;

    document.getElementById('searchBtn').addEventListener('click', open);
    modal.querySelector('[data-close]').addEventListener('click', close);

    input.addEventListener('input', U.debounce(function () {
      var q = U.norm(input.value);
      cur = -1;
      if (q.length < 2) {
        results.innerHTML = '<div class="muted" style="padding:16px;text-align:center">Saisissez au moins 2 caractères.</div>';
        return;
      }
      var terms = q.split(' ').filter(Boolean);
      var hits = buildIndex().filter(function (it) {
        var k = U.norm(it.k);
        return terms.every(function (t) { return k.indexOf(t) !== -1; });
      }).slice(0, 40);

      if (!hits.length) {
        results.innerHTML = '<div class="muted" style="padding:16px;text-align:center">Aucun résultat.</div>';
        return;
      }
      results.innerHTML = hits.map(function (it, i) {
        return '<a class="sres" href="' + it.h + '" data-i="' + i + '">' +
          '<div class="sres__t">' + U.esc(it.t) + '</div>' +
          '<div class="sres__m">' + U.esc(it.m) + '</div></a>';
      }).join('');
    }, 130));

    results.addEventListener('click', function (e) { if (e.target.closest('.sres')) close(); });

    input.addEventListener('keydown', function (e) {
      var items = U.qsa('.sres', results);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!items.length) return;
        items.forEach(function (x) { x.classList.remove('is-cur'); });
        cur = (e.key === 'ArrowDown') ? (cur + 1) % items.length : (cur - 1 + items.length) % items.length;
        items[cur].classList.add('is-cur');
        items[cur].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        if (cur >= 0 && items[cur]) { location.hash = items[cur].getAttribute('href').slice(1); close(); }
        else if (items.length) { location.hash = items[0].getAttribute('href').slice(1); close(); }
      } else if (e.key === 'Escape') { close(); }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) { close(); return; }
      // « / » ouvre la recherche, sauf en cours de saisie.
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      if (e.key === '/' && modal.hidden) { e.preventDefault(); open(); }
      if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); open(); }
    });
  }

  /* ============================ Démarrage ============================ */
  function boot() {
    viewEl = document.getElementById('view');
    mainEl = document.getElementById('main');

    // Vérification d'intégrité : sans données, mieux vaut un message clair qu'un écran mort.
    if (!App.SECTIONS || !App.SECTIONS.length) {
      document.getElementById('boot').innerHTML = '<div style="text-align:center;padding:30px"><div style="font-size:40px">⚠️</div><p>Données du cours introuvables.</p></div>';
      return;
    }

    setupTheme();
    setupSidebar();
    setupSearch();

    window.addEventListener('hashchange', render);
    render();

    document.getElementById('topbar').hidden = false;
    document.getElementById('sidebar').hidden = false;
    mainEl.hidden = false;

    setTimeout(function () {
      var b = document.getElementById('boot');
      b.classList.add('is-done');
      setTimeout(function () { b.remove(); }, 450);
    }, 260);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.App = window.App || {});

</script>
